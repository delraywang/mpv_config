# uosc 主界面配置文件
# 说明：本文件只控制 uosc 控件外观、菜单、时间轴、按钮布局等，不控制 mpv 核心播放参数。

# 当前播放位置的时间轴显示样式：line=线条，bar=条形
timeline_style=line

# line 样式下的时间轴线宽，单位像素
timeline_line_width=2

# 时间轴展开时的高度，单位像素；0 表示禁用展开时间轴
timeline_size=40

# 时间轴在哪些状态下始终可见；可填 paused,audio,image,video,idle,windowed,fullscreen，逗号分隔
timeline_persistency=

# 时间轴背景顶部边框宽度，用于区分视频画面和 UI
timeline_border=1

# 鼠标在时间轴上滚轮时每次跳转秒数；加 ! 表示精确跳转，例如 5!
timeline_step=5

# 是否在时间轴上显示流媒体缓冲缓存区域
timeline_cache=yes

# 是否显示 YouTube 热力图：overlay=叠加，above=显示在上方，no=关闭
timeline_heatmap=overlay

# 最小化进度条显示时机：windowed=窗口模式，fullscreen=全屏，always=总是，never=从不
progress=windowed

# 最小化进度条高度，单位像素
progress_size=2

# 最小化进度条线宽
progress_line_width=20

# 控件栏按钮布局；从左到右排列，支持 uosc 内置控件和脚本按钮
# 当前包含：菜单、播放历史、视频轨、版本/Edition、流媒体清晰度、弹幕搜索、弹幕开关、弹幕菜单、片头片尾设置、统计信息、字幕轨、音频轨、速度、循环、上一项/列表/下一项、全屏
controls=menu,button:history,gap,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,button:danmaku,cycle:toggle_on:show_danmaku@uosc_danmaku:on=toggle_on/off=toggle_off?弹幕开关,button:danmaku_menu,button:skip_intro_outro_settings,command:info_outline:script-binding display-stats-toggle?统计信息,command:subtitles:script-binding uosc/subtitles#sub>0?字幕轨,command:graphic_eq:script-binding uosc/audio#audio>1?音频轨,gap,space,speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen

# 控件按钮基础尺寸，单位像素
controls_size=32

# 控件栏外边距
controls_margin=8

# 控件之间的间距
controls_spacing=2

# 控件栏在哪些状态下始终可见；为空表示按默认自动显示/隐藏
controls_persistency=

# 音量控件位置：none=不显示，left=左侧，right=右侧
volume=right

# 音量控件尺寸
volume_size=40

# 音量控件边框宽度
volume_border=1

# 鼠标滚轮调节音量的步进值
volume_step=1

# 音量控件在哪些状态下始终可见；为空表示默认行为
volume_persistency=

# 速度控件每次调整步进值
speed_step=0.1

# 速度步进是否按倍率计算；no=按固定数值增减
speed_step_is_factor=no

# 速度控件在哪些状态下始终可见；为空表示默认行为
speed_persistency=

# 菜单项目高度
menu_item_height=36

# 菜单最小宽度
menu_min_width=260

# 菜单内边距
menu_padding=4

# 是否支持直接输入文字搜索菜单项；yes=输入即搜索，no=需要 / 或 Ctrl+F 激活搜索
menu_type_to_search=yes

# 顶部标题栏显示模式：never=从不显示，no-border=无边框窗口显示，always=总是显示
top_bar=no-border

# 顶部标题栏高度
top_bar_size=40

# 顶部窗口控制按钮位置：no=隐藏，left=左侧，right=右侧
top_bar_controls=right

# 顶部主标题：no=隐藏，yes=继承 mpv 标题，也可填自定义模板
top_bar_title=yes

# 顶部副标题模板；例如 ${filename}，为空表示不显示
top_bar_alt_title=

# 副标题显示方式：below=主标题下方，toggle=点击标题时在主/副标题间切换
top_bar_alt_title_place=below

# 加载指定类型文件时闪现顶部栏；可填 audio,video,image,chapter
top_bar_flash_on=video,audio

# 顶部栏在哪些状态下始终可见；为空表示默认行为
top_bar_persistency=

# 无边框模式下绘制的窗口边框宽度
window_border_size=1

# 播放列表为空且文件播放结束时，是否自动加载同目录下一个文件
autoload=no

# 是否启用 uosc 的随机播放/随机目录项模式
shuffle=no

# UI 整体缩放比例
scale=1

# 全屏时 UI 缩放比例
scale_fullscreen=1.3

# 文本缩放比例，用于适配字体显示大小
font_scale=1

# 文字和图标直接绘制在视频上时的描边大小
text_border=1.2

# 按钮、菜单、矩形背景等圆角半径
border_radius=4

# 颜色覆盖配置，格式为 key=RRGGBB，多个用逗号分隔；为空表示使用默认配色
color=

# 背景/形状透明度覆盖配置，多个用逗号分隔；不会影响文字透明度
opacity=

# 精细化功能；text_width=更精确文字宽度，sorting=更好的文件名排序
refine=

# UI 动画持续时间，单位毫秒
animation_duration=100

# flash-* 系列命令的闪烁持续时间，单位毫秒
flash_duration=1000

# 鼠标靠近 UI 元素多少像素以内开始淡入
proximity_in=40

# 鼠标离开 UI 元素多少像素以外开始淡出
proximity_out=120

# 是否强制 UI 文字使用粗体
font_bold=no

# 顶部/时间轴显示的剩余时间类型：total=总时长，playtime-remaining=按当前速度折算剩余播放时间，time-remaining=实际剩余时间
destination_time=playtime-remaining

# 时间显示的小数精度；0 表示不显示小数秒
time_precision=0

# 当流媒体缓冲剩余低于该秒数时，在时间轴显示缓冲时间；0=禁用
buffered_time_threshold=60

# 是否跟随 mpv 鼠标自动隐藏来隐藏 UI
autohide=no

# 暂停指示器模式：flash=暂停/播放时闪现，static=暂停时常驻，manual=手动控制
pause_indicator=flash

# 流媒体清晰度菜单列出的选项
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144

# 识别为视频文件的扩展名列表
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m

# 识别为音频文件的扩展名列表
audio_types=aac,ac3,aiff,ape,au,cue,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv

# 识别为图片文件的扩展名列表
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp

# 识别为字幕文件的扩展名列表
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,sbv,slt,smi,sub,sup,srt,ssa,ssf,ttxt,txt,usf,vt,vtt

# 识别为播放列表文件的扩展名列表
playlist_types=m3u,m3u8,pls,url,cue

# 自动加载/文件导航时允许加载的文件类型池；same 表示当前文件同类
load_types=video,audio,image

# 打开文件菜单的默认目录；~/ 表示用户目录，Windows 可用 {drives} 显示磁盘列表
default_directory=~/

# 读取目录时是否显示隐藏文件；当前主要影响以点开头的文件
show_hidden_files=no

# 删除文件时是否移动到回收站/废纸篓；no=直接按脚本行为处理
use_trash=no

# 是否根据 UI 元素可见状态自动调整 OSD 边距
adjust_osd_margins=yes

# 章节范围标记颜色；用于 OP/ED/广告等章节在时间轴上的着色
chapter_ranges=openings:30abf964,endings:30abf964,ads:c54e4e80

# 章节名称匹配规则；用于识别 OP/ED 等章节名称
chapter_range_patterns=openings:オープニング;endings:エンディング

# 使用简体中文语言包，en 表示英文兜底
languages=zh-hans,en

# 字幕下载目录；~~ 表示 mpv 配置目录。前缀 ! 可强制所有字幕保存到该目录
subtitles_directory=~~/subtitles

# 禁用指定 uosc 元素；可填 window_border,top_bar,timeline,controls,volume,idle_indicator,audio_indicator,buffering_indicator,pause_indicator
disable_elements=

# 备注：uosc 还会读取部分 mpv.conf 属性，例如 osd-font、osd-playlist-entry、slang
