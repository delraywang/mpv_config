# thumbfast 缩略图预览配置
# 作用：在时间轴悬停时生成并显示视频缩略图。

# IPC socket 路径；留空表示自动生成
socket=

# 缩略图缓存路径；留空表示自动生成
thumbnail=

# 缩略图生成的最大高度，单位像素；HiDPI 下会按比例缩放
max_height=200

# 缩略图生成的最大宽度，单位像素；HiDPI 下会按比例缩放
max_width=200

# 缩略图显示缩放倍率；需要 mpv 0.38+，质量通常不如直接提高 max_height/max_width
scale_factor=1

# 是否对 HDR/高动态范围画面做色调映射；auto=自动，no=关闭
tone_mapping=auto

# OSD overlay ID；用于显示缩略图，通常无需修改
overlay_id=42

# 是否在文件加载时立即启动缩略图进程；yes=首次悬停更快，no=按需启动
spawn_first=no

# 缩略图进程空闲多少秒后退出；0=不因空闲退出
quit_after_inactivity=0

# 是否对网络播放启用缩略图
network=no

# 是否对纯音频启用缩略图
audio=no

# 缩略图生成进程是否启用硬件解码；no=更兼容，yes=可能更快
hwdec=no

# 仅 Windows：是否使用原生 Windows API 写入管道；需要 LuaJIT
direct_io=no

# mpv 可执行文件路径；mpv=从当前环境/默认路径查找
mpv_path=mpv
