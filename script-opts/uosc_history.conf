# uosc_history 播放历史菜单配置
# 项目地址：https://github.com/Koopex/uosc_history_menu

# 界面语言：zh=中文，en=英文
language=zh

# 打开 mpv 后的动作：
# resume=恢复上次播放的文件
# menu=打开播放记录菜单
# none=不自动执行动作
start_action=none

# 文件夹续播提示：
# yes=打开文件夹内视频时，如果同文件夹有历史记录则提示是否跳转续播
# no=不弹出文件夹续播提示
resume_in_folder=no

# 历史条目标题显示方式：
# yes=显示文件名
# no=显示媒体标题
filename=no

# 搜索结果排序：
# yes=按播放时间排序
# no=使用 uosc 默认搜索结果排序
search_sorting=no

# 播放历史/收藏记录文件路径；~~home 表示 mpv 配置目录 portable_config
log_path=~~home/_cache/uosc_history.json

# 可用快捷键示例，当前只作为说明，未在本配置文件内直接绑定：
# r              script-binding uosc_history/history              # 播放记录
# Alt+r          script-binding uosc_history/enable_history       # 启用/禁用播放历史记录
# Ctrl+Alt+r     script-binding uosc_history/clear_history        # 清空播放记录
# d              script-binding uosc_history/bookmarks            # 收藏夹
# Ctrl+d         script-binding uosc_history/add_bookmarks        # 添加收藏
# Alt+d          script-binding uosc_history/toggle_quick_mark    # 切换快速收藏模式
# Ctrl+Alt+d     script-binding uosc_history/clear_bookmarks      # 清空收藏夹

# 可添加到 uosc.conf controls 的按钮示例：
# button:history        播放记录
# button:bookmarks      收藏夹
# button:add_bookmarks  添加收藏
