# uosc_danmaku 排序弹幕合并扩展
# 成功合并日志开关：yes 输出本次成功合并数量；no 关闭成功日志。默认 yes。
# 扩展或渲染失败等错误日志始终输出。
log_success=no
# 以序号 1 锚点为中心的候选时间窗口（秒）；允许小数，0 仅匹配相同时间。默认 5。
merge_time_window=5
# 合成弹幕显示时长，单位秒；默认 10。此值独立于普通固定弹幕的 fixtime。
merged_display_time=10
# 合成弹幕渲染颜色：留空时保留每条合成弹幕的颜色；可填 #RRGGBB、RRGGBB、
# 0xRRGGBB 或十进制 RGB 值。非法值自动保留原色。
merged_render_color=65280
# 字幕避让额外高度的基础值；会乘以当前主/副字幕的缩放，默认 10。
merged_subtitle_extra_height=10
