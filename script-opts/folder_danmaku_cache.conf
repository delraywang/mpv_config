# 按当前视频所在文件夹名称缓存弹幕开关状态

# 是否启用此脚本；yes=启用，no=禁用
enabled=yes

# 弹幕开关状态缓存文件路径；~~ 表示 mpv 配置目录 portable_config
cache_path=~~/_cache/folder-danmaku-cache.json

# 弹幕开关变化后的延迟保存时间，单位秒；用于避免频繁写盘
save_delay=0.8

# 文件加载后延迟恢复弹幕开关的时间，单位秒；给 uosc_danmaku 留出初始化时间
restore_delay=0.3

# 你的弹幕插件目录名是 uosc_danmaku，所以保持默认。
danmaku_script_name=uosc_danmaku

# uosc_danmaku 的历史记录文件。若你改过 uosc_danmaku 的 history_path，这里也要同步改。
danmaku_history_path=~~/_cache/danmaku-history.json
