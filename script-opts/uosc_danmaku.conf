# 弹幕 API 服务地址；当前使用自建 danmu_api 服务
api_server=https://danmu.delray.wang/8ynn3Z4FgtewDB4K

# uosc_danmaku 的弹幕关联历史文件；记录弹幕源、剧集匹配、全局弹幕开关等
history_path=~~/_cache/danmaku-history.json

# 弹幕字体是否加粗；no=不加粗，yes=加粗
bold=no

# 弹幕字体大小
fontsize=40

# 滚动弹幕显示时间，单位秒；数值越大滚动越慢
scrolltime=20

# 弹幕不透明度；0=完全透明，1=完全不透明
opacity=1

# 弹幕显示区域比例；0.3 表示只使用屏幕上方 30% 区域
displayarea=0.3

# 是否启用 fps 视频滤镜提升弹幕平滑度；会增加性能开销
vf_fps=yes

# fps 滤镜目标帧率；仅在 vf_fps=yes 时生效
fps=120
