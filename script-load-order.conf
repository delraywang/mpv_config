### Lua 脚本加载顺序
### 通过 mpv.conf 引入；调整脚本启动顺序时只需修改本文件。

# 关闭 scripts 目录的自动扫描，以下脚本按书写顺序显式加载。
load-scripts = no

# 先加载目录属性和播放速度相关脚本。
script = "~~/scripts/save_global_props.lua"
script = "~~/scripts/video_speed.lua"

# 统计信息语言入口必须先于统计脚本。
script = "~~/scripts/stats_locales/main.lua"
script = "~~/scripts/stats.lua"

# 缩略图和输入扩展。
script = "~~/scripts/thumbfast.lua"
script = "~~/scripts/input_plus.lua"

# 先加载 uosc，再加载依赖或扩展 uosc 的脚本。
script = "~~/scripts/uosc.lua"
script = "~~/scripts/uosc_history.lua"
script = "~~/scripts/resume_link.lua"
script = "~~/scripts/uosc_danmaku.lua"

# 片头片尾跳过和右方向键加速功能。
script = "~~/scripts/skip_intro_outro.lua"
script = "~~/scripts/right_hold_speed.lua"

# sub-auto=no 时启用智能匹配；其他模式交由 mpv 原生字幕规则处理。
script = "~~/scripts/episode_sub_autoload.lua"
